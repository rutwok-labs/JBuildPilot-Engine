name: Bug Report
description: File a bug report to help us improve JBuildPilot Engine.
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
        Please provide as much detail as possible to help us reproduce the issue.
  - type: input
    id: version
    attributes:
      label: JBuildPilot Version
      description: What version of JBuildPilot Engine are you using?
      placeholder: e.g., 0.1.0-alpha
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Which operating system are you running on?
      options:
        - Windows
        - macOS
        - Linux
        - Other (Specify in description)
    validations:
      required: true
  - type: dropdown
    id: java-version
    attributes:
      label: Java Runtime Version
      description: What JDK version is running JBuildPilot?
      options:
        - Java 21 (LTS)
        - Java 25
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Paste any relevant logs, stack traces, or `.jbe` file snippets here.
      render: shell
